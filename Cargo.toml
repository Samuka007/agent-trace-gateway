[package]
name = "agent-trace-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
pingora = { version = "0.8", features = ["proxy", "boringssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
# 0.28 对齐 openai-oss-forks tokio 层 fork 的版本号（0.27 patch 因版本错位
# 不生效，见 docs/atcd-design.md §12 D7.7）；rustls 出口给上游 wss 用
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
base64 = "0.22"

sha1_smol = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-stream = "0.1"
parking_lot = "0.12.5"
hex = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "socks", "rustls"] }
rusqlite = { version = "0.39", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
# 与 codex 同源的身份库：UA 的 OS 段与终端段由同一批库生成，保真由构造保证
os_info = "3.15"
codex-terminal-detection = { git = "https://github.com/openai/codex", package = "codex-terminal-detection" }
# LLM 请求的字段正确性由 codex 自身代码保证（fork 补丁仅翻转可见性，
# 见 fork 分支 atcd-libs 与 docs/atcd-requirements.md R8）
codex-core = { git = "https://github.com/Samuka007/codex", branch = "atcd-libs", package = "codex-core" }
codex-protocol = { git = "https://github.com/Samuka007/codex", branch = "atcd-libs", package = "codex-protocol" }
# OAuth（device + 粘贴回调）：wire 镜像 codex-rs/login 源码（见 oauth.rs
# 模块注释）。
urlencoding = "2"
# rama 全系对齐 codex 锁定的 alpha.4：0.3.0 正式版与 alpha.4 宏产物不兼容
rama-macros = "=0.3.0-alpha.4"
rama-error = "=0.3.0-alpha.4"
url = "2"
rand = "0.9"

[lib]
name = "agent_trace_gateway"
path = "src/lib.rs"

[profile.dev]
debug = 0

# codex 工作区对其 tungstenite 双层 fork 的 patch 不会随 git 依赖传播，
# 引用 codex-core/codex-login 时必须在本工作区重申（依赖对齐 codex）。
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
