[workspace]
members = ["crates/atg-model", "crates/atg-protocol", "crates/atg-harness"]
resolver = "2"

[package]
name = "agent-trace-gateway"
version = "0.3.3"
edition = "2021"

[dependencies]
atg-model = { path = "crates/atg-model" }
atg-protocol = { path = "crates/atg-protocol" }
atg-harness = { path = "crates/atg-harness" }
async-trait = "0.1"
bytes = "1"
http = "1"
pingora = { version = "0.8", features = ["proxy", "boringssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
parking_lot = "0.12.5"
hex = "0.4.3"
reqwest = "0.13.4"

[dev-dependencies]
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-stream = "0.1"
tokio-tungstenite = "0.27"
futures-util = "0.3"
sha1_smol = "1"

[lib]
name = "agent_trace_gateway"
path = "src/lib.rs"

[profile.dev]
debug = 0
