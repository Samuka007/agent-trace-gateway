[package]
name = "agent-trace-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
bytes = "1"
http = "1"
pingora = { version = "0.8", features = ["proxy", "boringssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
futures-util = "0.3"
base64 = "0.22"

sha1_smol = "1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-stream = "0.1"
parking_lot = "0.12.5"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["json", "stream", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "v7"] }
# 与 codex 同源的身份库：UA 的 OS 段与终端段由同一批库生成，保真由构造保证
os_info = "3.15"
codex-terminal-detection = { git = "https://github.com/openai/codex", package = "codex-terminal-detection" }

[lib]
name = "agent_trace_gateway"
path = "src/lib.rs"

[profile.dev]
debug = 0
