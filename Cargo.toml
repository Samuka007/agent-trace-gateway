[workspace]
members = ["crates/atg-model", "crates/atg-protocol", "crates/atg-harness"]
resolver = "2"

[package]
name = "agent-trace-gateway"
version = "0.4.0"
edition = "2021"

[features]
# Bench-only (ATG issue #3): compile in the capture-off passthrough mode
# (config `trace.mode = "off"` — skip capture/parsing, records degrade to
# timing/error/cancel shells). The mode is a functional-debug isolation
# knob, NOT a deployment configuration: numbers measured with capture
# disabled describe a configuration that is never deployed, so production
# builds MUST NOT enable this: a prod build rejects `trace.mode = "off"` at
# config validation.
bench-trace-mode = []

[dependencies]
atg-model = { path = "crates/atg-model" }
atg-protocol = { path = "crates/atg-protocol" }
atg-harness = { path = "crates/atg-harness" }
async-trait = "0.1"
bytes = "1"
http = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
pingora = { version = "0.8", features = ["proxy", "boringssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
parking_lot = "0.12.5"
hex = "0.4.3"
reqwest = { version = "0.13.4", features = ["stream"] }

[dev-dependencies]
proptest = "1"
toml = "0.8"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-stream = "0.1"
tokio-tungstenite = "0.27"
futures-util = "0.3"
sha1_smol = "1"

[lib]
name = "agent_trace_gateway"
path = "src/lib.rs"

[profile.dev]
debug = 0
