name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Toolchain comes from flake.nix devShell (fenix fromToolchainFile pinned to
    # codex-rs/rust-toolchain.toml, currently rust 1.95.0) — the exact same
    # compiler as local dev, on every push. This replaces the floating
    # rust:1-bookworm container, which cannot link the codex dependency tree
    # (openssl-sys needs libssl-dev; boring-sys needs its own clang/cmake/go
    # set). The devShell already carries openssl + pkg-config + bindgenHook,
    # so neither problem survives the switch.
    runs-on: ubuntu-latest
    env:
      # cargo output must live on the reclaimed /nix volume: nothing-but-nix
      # folds the root disk's free space into /nix (root safe-haven defaults
      # to 2GB), so the default ./target fills the root disk on the codex dep
      # tree -> "No space left on device" writing target/debug/deps/*.rmeta.
      # Same volume nix-installer already uses for builds (build-dir above).
      CARGO_TARGET_DIR: /nix/build/target
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~115GB for /nix (default ~20GB is not enough for the codex
      # dep tree: ~6.5GB devShell closure + 350-crate target dir + BoringSSL).
      # witness-carnage: synchronous purge before builds (README names large
      # Rust compilations as the case needing it). Pinned to commit SHA.
      - uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
        with:
          hatchet-protocol: cleave
          witness-carnage: true
          # chown -R "$(id -u)":"$(id -g)" /nix at mount time: /nix defaults to
          # root-owned, but cargo runs as the runner user with
          # CARGO_TARGET_DIR=/nix/build/target below -> "Permission denied
          # (os error 13) at path /nix/build/..." without this. The only
          # /nix/build writer in this job is the runner-user cargo (no
          # sandboxed derivation builds land there), so user ownership is safe.
          nix-permission-edict: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
        with:
          # Raise GitHub API rate limits for flake-input fetches
          # (github:Samuka007/codex/atcd-libs, nixpkgs tarball).
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Put derivation builds on the reclaimed big volume.
          extra-conf: |
            build-dir = /nix/build

      # Optional acceleration only: caches the cargo target dir + registry
      # across runs keyed on Cargo.lock. Safe to drop without affecting
      # correctness. cache-directories must track CARGO_TARGET_DIR above,
      # otherwise rust-cache keeps caching the old (now unused) ./target.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: |
            /nix/build/target

      - name: rustfmt
        run: nix develop -c cargo fmt --check

      - name: clippy
        run: nix develop -c cargo clippy --all-targets -- -D warnings

      - name: test
        run: nix develop -c cargo test

  # Self-hosted variant (NOT active — needs user approval to register a
  # runner; see .scratch/atcd-ci-nix/spec.md Comments): swap the two lines
  # below in, drop the nix-installer step, and preinstall nix on the runner
  # image with the atcd-dev egress recipe (nix channel -> TUNA, cargo ->
  # rsproxy-sparse, mihomo socks5h://10.0.100.240:10809 as github fallback).
  #   runs-on: [self-hosted, atg-builder]
  # Everything else stays identical: the same `nix develop -c ...` steps.

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/samuka007/agent-trace-gateway:latest
            ghcr.io/samuka007/agent-trace-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
