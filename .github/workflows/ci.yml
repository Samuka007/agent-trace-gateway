name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      # BoringSSL (via pingora) needs cmake, clang, go, perl, pkg-config.
      - name: Install boringssl build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake clang golang perl pkg-config git
          rm -rf /var/lib/apt/lists/*

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/samuka007/agent-trace-gateway:latest
            ghcr.io/samuka007/agent-trace-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max