name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      # BoringSSL (via pingora) needs cmake, clang, go, perl, pkg-config.
      - name: Install boringssl build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake clang golang perl pkg-config git
          rm -rf /var/lib/apt/lists/*

      - name: Add rustfmt/clippy components
        run: rustup component add rustfmt clippy

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 分支 push：latest + sha；vX.Y.Z tag push：额外加 X.Y.Z 与 X.Y semver tag
      - name: Derive image tags
        id: meta
        run: |
          TAGS="ghcr.io/samuka007/agent-trace-gateway:latest
          ghcr.io/samuka007/agent-trace-gateway:${GITHUB_SHA}"
          REF_NAME="${GITHUB_REF_NAME}"
          VERSION="${REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAGS="ghcr.io/samuka007/agent-trace-gateway:${VERSION}
          ghcr.io/samuka007/agent-trace-gateway:${VERSION%.*}
          ${TAGS}"
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # 仅 vX.Y.Z tag push 生成 GitHub Release（分支 push 跳过）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release with image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          MAJOR_MINOR="${VERSION%.*}"
          BODY=$(mktemp)
          {
            echo "## 镜像"
            echo ""
            echo '```'
            echo "ghcr.io/samuka007/agent-trace-gateway:${VERSION}"
            echo "ghcr.io/samuka007/agent-trace-gateway:${MAJOR_MINOR}"
            echo "digest: ${DIGEST}"
            echo '```'
            echo ""
            echo "部署必须 pin digest — :latest 与 :<sha> 会被后续 CI 覆盖，不可用于生产。"
            echo ""
            echo "变更明细见 [CHANGELOG.md](https://github.com/Samuka007/agent-trace-gateway/blob/main/CHANGELOG.md)。"
          } > "$BODY"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$BODY"